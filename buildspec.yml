version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging into Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region \$AWS_DEFAULT_REGION | docker login --username AWS --password-stdin \(AWS_ACCOUNT_ID.dkr.ecr.\)AWS_DEFAULT_://amazonaws.com
      - REPOSITORY_URI=\$AWS_ACCOUNT_ID.dkr.ecr.\(AWS_DEFAULT_://amazonaws.com/\)IMAGE_REPO_NAME
      - echo Updating Kubeconfig configuration...
      - aws eks update-kubeconfig --region \(AWS_DEFAULT_REGION --name\)EKS_CLUSTER_NAME
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t \$REPOSITORY_URI:latest .
      - docker tag \$REPOSITORY_URI:latest \(REPOSITORY_URI:\)CODEBUILD_RESOLVED_SOURCE_VERSION
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images to ECR...
      - docker push \$REPOSITORY_URI:latest
      - docker push \(REPOSITORY_URI:\)CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo Deploying configurations to Kubernetes cluster node space...
      - sed -i "s|REPLACE_WITH_YOUR_ECR_IMAGE_URL|\$REPOSITORY_URI|g" k8s/deployment.yaml
      - kubectl apply -f k8s/deployment.yaml
      - kubectl apply -f k8s/service.yaml
      - echo Deployment finished successfully.
